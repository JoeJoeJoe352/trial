<section class="admin-section">
  <h2>Categories</h2>

  <form class="inline-form" [formGroup]="form" (ngSubmit)="submit()">
    <input type="text" formControlName="name" placeholder="Name" />
    <input type="text" formControlName="slackWebhookUrl" placeholder="Slack webhook URL (optional)" />
    <button type="submit">{{ editingId() ? 'Save' : 'Add' }}</button>
    @if (editingId()) {
      <button type="button" class="secondary" (click)="cancelEdit()">Cancel</button>
    }
  </form>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <table class="admin-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Slack webhook</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (category of categories(); track category.id) {
        <tr>
          <td>{{ category.name }}</td>
          <td>{{ category.slug }}</td>
          <td>{{ category.slackWebhookUrl || '—' }}</td>
          <td>
            <button type="button" (click)="startEdit(category)">Edit</button>
            <button type="button" (click)="remove(category.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
