services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --proxy-config proxy.conf.json"
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
