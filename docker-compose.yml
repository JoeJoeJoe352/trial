services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news_alerts
      POSTGRES_PASSWORD: news_alerts
      POSTGRES_DB: news_alerts
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_alerts"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://news_alerts:news_alerts@db:5432/news_alerts?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
